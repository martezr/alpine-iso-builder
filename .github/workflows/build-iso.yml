jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: alpine:3.23

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk add --no-cache \
            alpine-sdk \
            abuild \
            bash \
            git \
            xorriso \
            squashfs-tools \
            syslinux \
            mkinitfs

      - name: Build APK repository
        run: |
          chmod +x scripts/build-apk-repo.sh
          ./scripts/build-apk-repo.sh

      - name: Build ISO
        run: |
          chmod +x scripts/build-iso.sh
          ./scripts/build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: alpine-appliance
          path: aports/packages/*.iso