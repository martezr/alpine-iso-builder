name: Build Alpine ISO

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: alpine:3.23

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apk add --no-cache \
            alpine-sdk \
            apk-tools \
            squashfs-tools \
            xorriso \
            syslinux \
            git \
            bash

      - name: Create build user
        run: |
          adduser -D builder
          addgroup builder abuild

          mkdir -p /home/builder/.abuild

          chown -R builder:builder \
            /home/builder \
            "$GITHUB_WORKSPACE"

      - name: Generate abuild key
        run: |
          su builder -c "abuild-keygen -a -n -i"

      - name: Build ISO
        run: |
          chmod +x scripts/build-iso.sh
          su builder -c "cd $GITHUB_WORKSPACE && ./scripts/build-iso.sh"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: alpine-custom-iso
          path: output/*.iso