name: Alpine Appliance Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: alpine:3.23

    steps:
      # ------------------------------------------------------------
      # Checkout repo
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Install build dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          apk add --no-cache \
            alpine-sdk \
            abuild \
            git \
            bash \
            xorriso \
            squashfs-tools \
            syslinux \
            mkinitfs \
            doas

      # ------------------------------------------------------------
      # Clone aports (required for mkimage)
      # ------------------------------------------------------------
      - name: Clone aports
        run: |
          git clone --depth 1 \
            --branch 3.23-stable \
            https://github.com/alpinelinux/aports.git \
            "$GITHUB_WORKSPACE/aports"

      # ------------------------------------------------------------
      # Create non-root builder user (required by mkimage/abuild)
      # ------------------------------------------------------------
      - name: Setup abuild key
        run: |
          id builder &>/dev/null || adduser -D builder
          addgroup builder abuild || true

          chown -R builder:builder /home/builder 2>/dev/null || true

          su builder -c "abuild-keygen -a -n -i"

          su builder -c '
            KEY=$(ls /home/builder/.abuild/*.rsa | head -n 1)
            echo "PACKAGER_PRIVKEY=$KEY" >> /home/builder/.abuild/abuild.conf
          '
      # ------------------------------------------------------------
      # Build custom APKs (from your repo, not aports-local)
      # ------------------------------------------------------------
      - name: Build APK packages
        run: |
          su builder -c '
            for dir in $(find packages -name APKBUILD -exec dirname {} \;); do
              cd "$GITHUB_WORKSPACE/$dir" && abuild -r
            done
          '

      # ------------------------------------------------------------
      # Build ISO using mkimage
      # ------------------------------------------------------------
      - name: Build ISO
        run: |
          APORTS_DIR="$GITHUB_WORKSPACE/aports"

          su builder -c "
            $APORTS_DIR/scripts/mkimage.sh \
              --tag v3.23 \
              --arch x86_64 \
              --profile myappliance \
              --repository https://dl-cdn.alpinelinux.org/alpine/v3.23/main \
              --repository https://dl-cdn.alpinelinux.org/alpine/v3.23/community
          "

      # ------------------------------------------------------------
      # Upload artifact
      # ------------------------------------------------------------
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: alpine-appliance
          path: aports/packages/**/*.iso