name: Build Alpine ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: alpine:3.23

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk add --no-cache \
            alpine-sdk \
            abuild \
            bash \
            git \
            xorriso \
            squashfs-tools \
            syslinux \
            mkinitfs

      - name: Build APK repository
        run: |
          chmod +x scripts/build-apk-repo.sh
          ./scripts/build-apk-repo.sh

      - name: Build ISO
        run: |
          adduser -D builder
          addgroup builder abuild
          chown -R builder:builder .

          su builder -c '
            cd aports && ./scripts/mkimage.sh \
              --tag v3.23 \
              --arch x86_64 \
              --profile myappliance \
              --repository https://dl-cdn.alpinelinux.org/alpine/v3.23/main \
              --repository https://dl-cdn.alpinelinux.org/alpine/v3.23/community
          '
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: alpine-appliance
          path: aports/packages/*.iso